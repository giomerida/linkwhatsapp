<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generador de Links de WhatsApp</title>
  <meta name="author" content="Giovanni Mérida | Developer Front-End">
  <link rel="shortcut icon" href="#" type="image/x-icon">
  
  <!-- Tipografía moderna Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

</head>
<body>

  <div class="main-wrapper">
    <div class="header">
      <div class="logo-badge">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
          <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/>
        </svg>
      </div>
      <h1 class="titulo">Generador de Links</h1>
      <p class="subtitulo">Crea tu enlace personalizado de WhatsApp y genera su código QR al instante</p>
    </div>

    <div class="card">
      <div class="form-container">
        <form>
          <div class="input-group">
            <label for="phone">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
              Número de teléfono (con código de país):
            </label>
            <input type="tel" id="phone" placeholder="Ej. 5215512345678" required>
          </div>

          <div class="input-group">
            <label for="message">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
              Mensaje personalizado:
            </label>
            <textarea id="message" placeholder="Escribe tu mensaje aquí..." required></textarea>
          </div>

          <button type="submit">Generar link y Código QR</button>
        </form>

        <div class="results-wrapper">
          <!-- Contenedor para el enlace generado -->
          <div class="link-container"></div>

          <!-- Contenedor para el código QR -->
          <div id="qr-code"></div>
        </div>
      </div>
    </div>

    <!-- Pie de página -->
    <footer class="footer">
      Creado por <a href="https://www.giomerida.dev" target="_blank" id="creator-link">Giodev | Developer Front-End</a>
    </footer>
  </div>

  <!-- Librería QRCode.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <script>
    const form = document.querySelector('form');
    const linkContainer = document.querySelector('.link-container');
    const qrCodeContainer = document.getElementById('qr-code');

    function copyToClipboard(text) {
      const textArea = document.createElement('textarea');
      textArea.value = text;
      document.body.appendChild(textArea);
      textArea.select();
      document.execCommand('copy');
      document.body.removeChild(textArea);
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const phone = document.querySelector('#phone').value;
      const message = document.querySelector('#message').value;
      const encodedMessage = encodeURIComponent(message);
      const url = `https://api.whatsapp.com/send?phone=${phone}&text=${encodedMessage}`;

      // Limpiar contenedores
      linkContainer.innerHTML = '';
      qrCodeContainer.innerHTML = '';

      // Mostrar el enlace generado
      const linkText = document.createElement('p');
      linkText.innerText = url;
      linkContainer.appendChild(linkText);

      // Botón copiar
      const copyButton = document.createElement('button');
      copyButton.innerText = 'Copiar enlace';
      copyButton.className = 'copy-button';
      copyButton.addEventListener('click', () => {
        copyToClipboard(url);
        copyButton.innerText = '¡Copiado al portapapeles!';
        setTimeout(() => copyButton.innerText = 'Copiar enlace', 2000);
      });
      linkContainer.appendChild(copyButton);

      // Generar el código QR debajo del enlace
      new QRCode(qrCodeContainer, {
        text: url,
        width: 160,
        height: 160
      });
    });
  </script>
</body>
</html>
